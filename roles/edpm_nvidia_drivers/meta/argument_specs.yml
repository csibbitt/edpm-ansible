---
argument_specs:
  main:
    short_description: The main entry point for the edpm_nvidia_drivers role.
    description: |
      Installs and configures NVIDIA GPU drivers on RHEL systems.
      Supports installation from NVIDIA repositories or custom URLs.
      Can install container tools and management libraries.
    options:
      edpm_nvidia_drivers_repo_url:
        type: str
        default: "https://developer.download.nvidia.com/compute/cuda/repos/rhel9/"
        description: NVIDIA repository URL for driver installation
      edpm_nvidia_drivers_module_version:
        type: str
        default: "latest-dkms"
        description: NVIDIA Driver module version to install from NVIDIA repo
      edpm_nvidia_drivers_url:
        type: str
        default: ""
        description: |
          Custom NVIDIA driver URL (if set, driver will be installed from this URL instead of NVIDIA repo).
          Must end with .rpm or .run extension.
      edpm_nvidia_drivers_force_host_mode:
        type: bool
        default: false
        description: Whether to force host mode (host drivers don't include CUDA)
      edpm_nvidia_drivers_cleanup_temp_files:
        type: bool
        default: true
        description: Whether to cleanup temporary files after installation
      edpm_nvidia_drivers_install_cuda_drivers:
        type: bool
        default: true
        description: Whether to install CUDA drivers (cuda-drivers package)
      edpm_nvidia_drivers_install_container_tools:
        type: bool
        default: true
        description: Whether to install NVIDIA Container Tools RPM
      edpm_nvidia_drivers_container_tools_version_release:
        type: str
        default: "1.17.8-1"
        description: Version and release of NVIDIA Container Tools package to install
      edpm_nvidia_drivers_generate_cdi_config:
        type: bool
        default: true
        description: Whether to generate CDI configuration for NVIDIA containers
      edpm_nvidia_drivers_install_management_library:
        type: bool
        default: true
        description: Whether to install NVIDIA Management Library RPM
      edpm_nvidia_drivers_management_library_package_name:
        type: str
        default: "libnvidia-ml"
        description: Package name for NVIDIA Management Library
      edpm_nvidia_drivers_blacklist_nouveau:
        type: bool
        default: true
        description: Whether to blacklist nouveau driver
      edpm_nvidia_drivers_force_install:
        type: bool
        default: false
        description: |
          Whether to force install NVIDIA driver even if already installed.
          NOTE: THIS IS FOR DEBUGGING ONLY AND IS NOT EXPECTED TO WORK (yet?)
